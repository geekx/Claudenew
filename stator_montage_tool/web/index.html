<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>扁线定子 Montage Process 状态编号定义图面</title>
<style>
  :root {
    --gold: #FFC000;
    --grey: #A6A6A6;
    --grey-dark: #6E6E6E;
    --blue: #2E6DB4;
    --red: #E8352C;
  }
  body { background:#ffffff; font-family:"WenQuanYi Zen Hei","Microsoft YaHei",sans-serif; margin:24px; color:#222; }
  h1 { font-size:20px; margin-bottom:18px; }
  #sheet { display:grid; gap:6px; align-items:stretch; }
  .row-label { display:flex; align-items:center; font-weight:bold; font-size:14px; padding-right:8px; }
  .cell { position:relative; width:120px; height:120px; background:#000; border-radius:4px; overflow:visible; }
  .cell.chevron-cell { background:#fff; }
  .cell svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .cell .caption { position:absolute; left:0; right:0; top:100%; margin-top:4px; text-align:center; font-size:11px; color:#333; white-space:nowrap; }
  .chevron-cell .label { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; pointer-events:none; }
  .chevron-cell .label .op { font-weight:bold; font-size:14px; }
  .chevron-cell .label .name { font-size:11px; line-height:1.25; padding:0 10px; }
  .cell.real-icon-cell { height:150px; background:#fafafa; border:1px solid #e2e2e2; }
  .cell.real-icon-cell svg { padding:6px; }
  .cell.real-icon-cell.empty { display:flex; align-items:center; justify-content:center; color:#bbb; font-size:11px; }
</style>
</head>
