<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>扁线定子 Montage Process 状态编号定义图面</title>
<style>
  :root {
    --gold: #FFC000;
    --grey: #A6A6A6;
    --grey-dark: #6E6E6E;
    --blue: #2E6DB4;
    --red: #E8352C;
  }
  body { background:#ffffff; font-family:"WenQuanYi Zen Hei","Microsoft YaHei",sans-serif; margin:24px; color:#222; }
  h1 { font-size:20px; margin-bottom:18px; }
  #sheet { display:grid; gap:6px; align-items:stretch; }
  .row-label { display:flex; align-items:center; font-weight:bold; font-size:14px; padding-right:8px; }
  .cell { position:relative; width:120px; height:120px; background:#000; border-radius:4px; overflow:visible; }
  .cell.chevron-cell { background:#fff; }
  .cell svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .cell .caption { position:absolute; left:0; right:0; top:100%; margin-top:4px; text-align:center; font-size:11px; color:#333; white-space:nowrap; }
  .chevron-cell .label { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; pointer-events:none; }
  .chevron-cell .label .op { font-weight:bold; font-size:14px; }
  .chevron-cell .label .name { font-size:11px; line-height:1.25; padding:0 10px; }
  .cell.real-icon-cell { height:150px; background:#fafafa; border:1px solid #e2e2e2; }
  .cell.real-icon-cell svg { padding:6px; }
  .cell.real-icon-cell.empty { display:flex; align-items:center; justify-content:center; color:#bbb; font-size:11px; }
</style>
</head>
<body>
<h1>扁线定子 Montage Process — 状态编号定义图面</h1>
<div id="sheet"></div>

<!-- ============ 静态 SVG 图标资源（未混淆，直接内嵌） ============ -->
<div style="display:none">

  <svg id="tpl-defs">
    <defs>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/>
      </marker>
      <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--gold)"/>
      </marker>
    </defs>
  </svg>

  <!-- 精确复刻自用户提供的 stator.svg（原始画布 178x145，见 web/README.md） -->

    <svg viewBox="0 0 178 145"><g class="stator">
      <rect x="12" y="0" width="153" height="22" rx="3.7" ry="3.7" fill="var(--gold)"/>
      <rect x="0" y="28" width="178" height="20" fill="var(--grey)"/>
      <rect x="0" y="52" width="178" height="15" fill="var(--grey)"/>
      <rect x="0" y="72" width="178" height="15" fill="var(--grey)"/>
      <rect x="0" y="97" width="178" height="15" fill="var(--grey)"/>
      <line x1="27" y1="112" x2="27" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="41" y1="112" x2="41" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="56" y1="112" x2="56" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="72" y1="112" x2="72" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="87" y1="112" x2="87" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="105" y1="112" x2="105" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="123" y1="112" x2="123" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="137" y1="112" x2="137" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
      <line x1="150" y1="112" x2="150" y2="139.332" stroke="var(--gold)" stroke-width="10.3125"/>
    </g></svg>
  </template>

  <template id="tpl-rotate-arrow">
    <svg viewBox="0 0 178 145"><g class="rotate-arrow">
      <path d="M 153.95 35 A 75 75 0 1 1 51.5 7.55" fill="none" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
    </g></svg>
  </template>

  <template id="tpl-clamp-00">
    <svg viewBox="0 0 100 100"><g class="clamp-00">
      <rect x="38" y="10" width="24" height="80" fill="var(--grey)"/>
      <polyline points="10,25 10,75 26,75" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="90,25 90,75 74,75" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="20" y1="50" x2="34" y2="50" stroke="var(--blue)" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <line x1="80" y1="50" x2="66" y2="50" stroke="var(--blue)" stroke-width="4" marker-end="url(#arrow-blue)"/>
    </g></svg>
  </template>

  <template id="tpl-clamp-ext">
    <svg viewBox="0 0 100 100"><g class="clamp-ext">
      <circle cx="50" cy="50" r="36" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
      <line x1="50" y1="94" x2="50" y2="80" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="50" cy="94" r="4" fill="var(--blue)"/>
      <line x1="11.9" y1="28" x2="24" y2="35" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="11.9" cy="28" r="4" fill="var(--blue)"/>
      <line x1="88.1" y1="28" x2="76" y2="35" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="88.1" cy="28" r="4" fill="var(--blue)"/>
    </g></svg>
  </template>

  <template id="tpl-clamp-int">
    <svg viewBox="0 0 100 100"><g class="clamp-int">
      <circle cx="50" cy="50" r="30" fill="none" stroke="var(--grey)" stroke-width="3" stroke-dasharray="6 5"/>
      <line x1="50" y1="60" x2="50" y2="78" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="50" cy="60" r="4" fill="var(--blue)"/>
      <line x1="41.3" y1="45" x2="25.8" y2="36" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="41.3" cy="45" r="4" fill="var(--blue)"/>
      <line x1="58.7" y1="45" x2="74.2" y2="36" stroke="var(--blue)" stroke-width="6" marker-end="url(#arrow-blue)"/>
      <circle cx="58.7" cy="45" r="4" fill="var(--blue)"/>
    </g></svg>
  </template>

  <template id="tpl-thermometer">
    <svg viewBox="0 0 100 100"><g class="thermometer">
      <rect x="42" y="8" width="16" height="60" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
      <circle cx="50" cy="78" r="16" fill="none" stroke="#ffffff" stroke-width="4"/>
      <rect class="mercury-stem" x="46" y="40" width="8" height="28" fill="var(--blue)"/>
      <circle class="mercury-bulb" cx="50" cy="78" r="10" fill="var(--blue)"/>
      <line x1="60" y1="14" x2="68" y2="14" stroke="#ffffff" stroke-width="2"/>
      <line x1="60" y1="24" x2="68" y2="24" stroke="#ffffff" stroke-width="2"/>
      <line x1="60" y1="34" x2="68" y2="34" stroke="#ffffff" stroke-width="2"/>
      <line x1="60" y1="44" x2="68" y2="44" stroke="#ffffff" stroke-width="2"/>
      <line x1="60" y1="54" x2="68" y2="54" stroke="#ffffff" stroke-width="2"/>
    </g></svg>
  </template>

  <template id="tpl-laser">
    <svg viewBox="0 0 100 100"><g class="laser">
      <rect x="30" y="25" width="40" height="50" fill="var(--grey-dark)"/>
      <line x1="30" y1="35" x2="70" y2="35" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
      <line x1="30" y1="45" x2="70" y2="45" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
      <line x1="30" y1="55" x2="70" y2="55" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
      <line x1="30" y1="65" x2="70" y2="65" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
      <g class="arrow-top">
        <line x1="42" y1="6" x2="58" y2="6" stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="8" x2="50" y2="21" stroke="var(--gold)" stroke-width="5" marker-end="url(#arrow-gold)"/>
      </g>
      <g class="arrow-bottom">
        <line x1="42" y1="94" x2="58" y2="94" stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="92" x2="50" y2="79" stroke="var(--gold)" stroke-width="5" marker-end="url(#arrow-gold)"/>
      </g>
    </g></svg>
  </template>

  <template id="tpl-chevron">
    <svg viewBox="0 0 100 100">
      <polygon class="chevron-poly" points="2,15 70,15 96,50 70,85 2,85 18,50" fill="var(--grey)"/>
    </svg>
  </template>

  <!-- 真实工艺图标资源（原图库素材，逐一原样内嵌，build.py 只补 viewBox） -->

</div>

</body>
</html>
